[package]
name = "macina-plugin-sdk"
version = "0.74.16604"
edition = "2021"
authors = ["https://github.com/jowharshamshiri"]
description = "Plugin SDK for MACINA document processing tools"
license = "MIT"

[dependencies]
capns = { path = "../capns" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["process", "time"] }
jsonschema = "0.17"
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[features]
default = []

[[bin]]
name = "plugin-validator"
path = "src/bin/plugin-validator.rs"

[[bin]]
name = "test-serialization"
path = "src/bin/test-serialization.rs"

[[bin]]
name = "plugin-tester"
path = "src/bin/plugin-tester.rs"
