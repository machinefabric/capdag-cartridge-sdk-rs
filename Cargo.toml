[package]
name = "machfab-cartridge-sdk"
version = "1.127.644"
edition = "2021"
authors = ["https://github.com/machinefabric"]
description = "Cartridge SDK for MachFab document processing tools"
license = "MIT"

[dependencies]
capdag = { git = "https://github.com/machinefabric/capdag-rs", tag = "v1.666.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Structured-query registry (structured_queries): Tera renders the prompt +
# dynamic-schema templates; anyhow is the shared error type across the SDK
# (machfab converts via its From<anyhow::Error>); tracing carries the
# registry's load diagnostics.
anyhow = "1.0"
tera = "1"
tracing = "0.1"
# Network-retry primitive (net_retry): operates directly on reqwest types so
# every cartridge shares one definition of "transient vs permanent" and one
# backoff policy. tokio supplies the async sleep between attempts; fastrand
# supplies the backoff jitter (tiny, no transitive C deps).
reqwest = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["time"] }
fastrand = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[features]
default = []
