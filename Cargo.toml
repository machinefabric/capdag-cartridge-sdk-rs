[package]
name = "lbvr-plugin-sdk"
version = "0.1.0"
edition = "2021"
authors = ["LBVR Team"]
description = "Plugin SDK for LBVR document processing tools"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["process", "time"] }

[features]
default = []